<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Komsan Nipharat — full-stack engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0E"/>
      <stop offset="55%" stop-color="#0B1117"/>
      <stop offset="100%" stop-color="#0A1014"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FF7D6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8FF7D6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8FF7D6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B949E" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.20"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>

    <ellipse cx="180" cy="20" rx="520" ry="330" fill="url(#glowA)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1180" cy="300" rx="420" ry="300" fill="url(#glowB)">
      <animate attributeName="opacity" values="1;0.6;1" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- slow sheen sweep -->
    <rect x="-360" y="0" width="360" height="320" fill="url(#sheen)">
      <animate attributeName="x" values="-360;1280" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

    <!-- monogram panel -->
    <g transform="translate(960,100)">
      <rect x="0" y="0" width="248" height="204" rx="22" fill="#0E151C" fill-opacity="0.72"/>
      <rect x="0.75" y="0.75" width="246.5" height="202.5" rx="21.5" fill="none" stroke="url(#panelStroke)" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(0,0)">
        <animateTransform attributeName="transform" type="translate" values="0,-5;0,3;0,-5" dur="8s" repeatCount="indefinite"/>
        <text x="124" y="112" text-anchor="middle" font-family="'SF Mono','JetBrains Mono','Cascadia Code',ui-monospace,Menlo,Consolas,monospace" font-size="62" font-weight="600" fill="#34D399" fill-opacity="0.92">&lt;/&gt;</text>
      </g>
      <text x="124" y="152" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="3.2" fill="#8B949E">SINCE 2017</text>
      <rect x="88" y="170" width="72" height="2" rx="1" fill="url(#accent)" fill-opacity="0.8"/>
    </g>

    <!-- identity: staggered reveal -->
    <text x="72" y="122" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="4.6" fill="#34D399" opacity="0">FULL-STACK ENGINEER<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.15s" fill="freeze"/></text>
    <text x="72" y="180" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#E6EDF3" opacity="0">Komsan Nipharat<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.35s" fill="freeze"/></text>

    <!-- terminal caret before the tagline -->
    <rect x="72" y="208" width="9" height="19" fill="#34D399" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.85;0;0;0.85" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <text x="92" y="222" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="19" fill="#9BA7B4" opacity="0">Go · TypeScript · NestJS · MongoDB — systems that finish in production.<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.55s" fill="freeze"/></text>
    <text x="72" y="254" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="16" fill="#6E7681" opacity="0">Payments, telecom and logistics: APIs, queue workers and the data under them.<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.75s" fill="freeze"/></text>

    <g transform="translate(56,282)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.95s" fill="freeze"/>
      <circle cx="5" cy="0" r="4" fill="#34D399">
        <animate attributeName="r" values="4;5.2;4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="5" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="13" fill="#8B949E">github.com/qaz74107410</text>
    </g>
  </g>
</svg>
