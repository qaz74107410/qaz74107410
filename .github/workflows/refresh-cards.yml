name: retype the bill of lading

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "projects.json"
      - "fonts/**"
      - ".github/workflows/refresh-cards.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools (subsets the embedded fonts)
        run: pip install fonttools==4.61.1

      - name: Retype the sheets from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/gen_manifest.py "${{ github.repository_owner }}"
          python3 scripts/gen_shooter.py "${{ github.repository_owner }}"

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --quiet --cached; then
            echo "cards already up to date"
          else
            git commit -m "chore: retype the bill of lading"
            git pull --rebase --autostash origin main
            git push
          fi
