name: refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen_cards.py"
      - "scripts/gen_shooter.py"
      - ".github/workflows/refresh-cards.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards from the GitHub GraphQL API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/gen_cards.py "${{ github.repository_owner }}"
          python3 scripts/gen_shooter.py "${{ github.repository_owner }}"
          python3 scripts/gen_projects.py "${{ github.repository_owner }}"

      - name: Render the 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ projects.json profile-3d-contrib
          if git diff --quiet --cached; then
            echo "cards already up to date"
          else
            git commit -m "chore: refresh profile cards"
            git pull --rebase --autostash origin main
            git push
          fi
